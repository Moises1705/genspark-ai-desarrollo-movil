name: climarapido
description: "Clima Rápido - consulta el clima de cualquier ciudad con una tarjeta clara y rápida."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Iconos estilo iOS por si se usan en widgets Cupertino.
  cupertino_icons: ^1.0.8

  # Cliente HTTP (opcional): listo para conectar una API real de clima.
  # Por ahora la app usa datos de ejemplo en weather_service.dart.
  http: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
